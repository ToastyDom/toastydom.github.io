name: Deploy website to GitHub Pages

# The site in `site/` is plain HTML and CSS — there is nothing to build.
# This workflow just uploads that folder to GitHub Pages as-is.

on:
  # Publish on every push to `main`
  push:
    branches: ["main"]
  # ...and allow a manual run from the Actions tab
  workflow_dispatch:

# Permission to read the repo and publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race each other
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload the site folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
